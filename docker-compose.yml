name: ticketdrop

services:
  redis:
    image: redis:7.4-alpine
    container_name: ticketdrop-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # appendonly: the stream is the event log; losing it loses in-flight drops.
    # noeviction: under an eviction policy Redis silently discards stream
    # entries as memory fills, which is exactly when a drop is happening.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: pgvector/pgvector:pg17
    container_name: ticketdrop-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketdrop}
      POSTGRES_DB: ${POSTGRES_DB:-ticketdrop}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, only when the data volume is empty.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketdrop} -d ${POSTGRES_DB:-ticketdrop}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ticketdrop-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
volumes:
  redis-data:
  postgres-data:
  prometheus-data:
