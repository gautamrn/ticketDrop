[project]
name = "ticketdrop-harness"
version = "0.1.0"
description = "LangGraph FSM harness: consumes ticket:drops, scores hype, executes the bounded reservation stage."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.60",
    "redis>=5.2.0",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
    "numpy>=2.1.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "anthropic>=0.42.0",
    "playwright>=1.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]

[project.scripts]
tdrop-harness = "harness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "BLE", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# These protocols mirror Playwright's own signatures, timeout argument included.
"src/harness/browser/page.py" = ["ASYNC109"]
"tests/*" = ["E501", "ASYNC109"]
