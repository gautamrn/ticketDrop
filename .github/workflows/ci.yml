name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ingest:
    name: Go ingest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: ingest-service/go.mod
          cache-dependency-path: ingest-service/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  harness:
    name: Python harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-harness/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests ../scripts
      - run: python -m ruff format --check src tests ../scripts
      - run: python -m pytest -q

  admin:
    name: Next.js admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  containers:
    name: Production images
    runs-on: ubuntu-latest
    needs: [ingest, harness, admin]
    strategy:
      matrix:
        service: [ingest-service, agent-harness, admin-panel]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ticketdrop/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  product-smoke:
    name: Product integration smoke
    runs-on: ubuntu-latest
    needs: [ingest, harness]
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker compose -f docker-compose.verify.yml up
          --build --abort-on-container-exit --exit-code-from verify
      - if: always()
        run: docker compose -f docker-compose.verify.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.verify.yml down -v --remove-orphans
